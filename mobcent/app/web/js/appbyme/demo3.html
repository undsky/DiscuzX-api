function showResult(text) {
    document.getElementById("result").innerText = text;
};

function showReply() {
	sq3.reply({
		isHide: false,
		boardId: 50, // 板块ID
		topicId: 2964, // 帖子ID
		toReplyId: 5932, // 引用的回复ID
		isQuote: true, // 是否引用
		beforeAsyncProcess: function(data) {
			if (!data) {
        		return;
        	}

        	var userIdsStr = "";
        	for (var key in data.userIds) {
        		userIdsStr += data.userIds[key] + "|";
        	}

        	var picturesStr = "";
        	for (var key in data.pictures) {
        		picturesStr += data.pictures[key] + "|";
        	}

        	var text = "reply success "
        			 + "content: " + data.content
        			 + ", locationStr: " + data.locationStr
        			 + ", longitude: " + data.longitude
        			 + ", latitude: " + data.latitude
        			 + ", isOpenLocation: " + data.isOpenLocation
        			 + ", audioPath: " + data.audioPath
        			 + ", audioLen: " + data.audioLen
        			 + ", pictures: " + picturesStr // 本地图片地址，如：file:///storage/emulated/0/DCIM/Screenshots/Screenshot_2016-07-28-11-46-18_com.pili.pldroid.streaming.camera.demo.png|file:///storage/emulated/0/DCIM/Screenshots/Screenshot_2016-07-28-11-46-18_com.pili.pldroid.streaming.camera.demo.png
        			 + ", userIds: " + userIdsStr; // @用户ID，如：336|517

            showResult(text);
		},
        success: function(data) {
        },
        error: function(data) {
        	// data: json = {errNo: int, errMsg: String}
            showResult("reply error errNo: " + data.errNo + ", errMsg: " + data.errMsg);
        },
        complete: function(result) {
        	// result true or false
            showResult("complete " + result);
        }
    });
}
